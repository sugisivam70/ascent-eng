<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="ascentGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1266B2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric Ascent Symbol: Precision 5-Axis Milling Arrowhead -->
  <g transform="translate(10, 10)">
    <polygon points="35,2 68,68 52,68 35,34 18,68 2,68" fill="url(#ascentGradDark)" />
    <polygon points="35,20 50,52 35,42 20,52" fill="#FFFFFF" opacity="0.95" />
    <circle cx="35" cy="35" r="4.5" fill="#38BDF8" />
    <line x1="35" y1="22" x2="35" y2="48" stroke="#101D35" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="22" y1="35" x2="48" y2="35" stroke="#101D35" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>
  <!-- Wordmark -->
  <text x="96" y="46" font-family="'Barlow', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="2" fill="#FFFFFF">ASCENT</text>
  <text x="246" y="46" font-family="'Barlow', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="300" letter-spacing="3" fill="#38BDF8">TECHNOLOGY</text>
  <!-- Subtitle -->
  <text x="98" y="68" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.5" fill="#94A3B8">PRECISION CNC &amp; VMC MACHINING • PEENYA</text>
</svg>